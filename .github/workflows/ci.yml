name: CI

on:
  push:
    branches: [main, work, oss-polish-repository]
  pull_request:

jobs:
  build:
    name: Build examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure root examples
        run: cmake -S . -B build -DHSE_BUILD_STDEXEC=OFF

      - name: Build root examples
        run: cmake --build build -j2
